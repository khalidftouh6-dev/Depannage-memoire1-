<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dépannage Mémoire</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0e3a4a"><link rel="icon" href="icon.svg">
<style>
:root{--bg:#f3f7f8;--ink:#10262e;--deep:#0e3a4a;--sun:#f2b632;--card:#fff;--line:#c9d9de}
@media(prefers-color-scheme:dark){:root{--bg:#0b1d24;--ink:#e6f0f2;--card:#122b35;--line:#2a4852}}
*{box-sizing:border-box}body{margin:0;font:17px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:70px}
header{background:var(--deep);color:#fff;padding:8px 14px;display:flex;flex-wrap:wrap;gap:4px;justify-content:space-between;align-items:center;position:sticky;top:0}
h1{font-size:17px;margin:0}main{padding:14px;max-width:640px;margin:auto}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}.c{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.n{font-size:34px;font-weight:700}button,select,input,textarea{font:inherit;min-height:48px;border-radius:8px;border:1px solid var(--line);padding:8px 12px;width:100%;margin:4px 0;background:var(--card);color:var(--ink)}
button{background:var(--deep);color:#fff;border:0;font-weight:600}button.s{background:var(--sun);color:#10262e}button.x{background:#9b2c2c}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--deep)}nav button{border-radius:0;margin:0;background:none;font-size:14px}
.b{display:inline-block;padding:2px 8px;border-radius:6px;font-size:14px;font-weight:600}
.urgente{background:#c0392b;color:#fff}.normale{background:#f2b632}.faible{background:#2e8b57;color:#fff}.demo{background:#ddd;color:#333}
@media print{header,nav,button{display:none}body{padding:0}}nav button{font-size:12px;padding:6px}</style></head><body><header><h1>💧 Dépannage Mémoire <small style="font-size:11px;opacity:.7">v1.0</small></h1><span style="display:flex;gap:6px"><button style="width:auto;min-height:32px;margin:0;font-size:13px;padding:2px 10px" onclick="L=L=='fr'?'ar':'fr';S?draw():loginUI()">FR/عربي</button><button class="x" style="width:auto;min-height:32px;margin:0;font-size:13px;padding:2px 10px" onclick="out()">Sortir</button></span><div style="width:100%;display:flex;justify-content:space-between;font-size:12px;opacity:.9"><span id="who"></span><span id="ss"></span></div></header>
<main id="m"></main><nav id="nv"></nav>
<script>
const TR={fr:{home:"Accueil",res:"Réservations",emp:"Employés",rep:"Rapport",claims:"Réclamations",meters:"Compteurs",neu:"Nouvelle réclamation",contract:"N° de contrat",type:"Type",prio:"Priorité",team:"Équipe",notes:"Notes",recap:"Récapitulatif — contrat normalisé :",ok:"Confirmer et enregistrer",back:"Corriger",
 nouvelle:"Nouvelle",affectee:"Affectée",en_cours:"En cours",traitee:"Traitée",transferee:"Transférée",urgente:"Urgente",normale:"Normale",faible:"Faible",search:"Contrat ou n° de compteur",savegps:"Enregistrer la position du compteur",
 demo:"Charger données de démonstration",empty:"Rien ici pour l'instant.",assign:"Affecter",recv:"Confirmer réception",start:"Démarrer",done:"Marquer traitée",transfer:"Transférer",cancel:"Annuler (erreur de saisie, motif requis)",hist:"réclamation(s) pour ce contrat",
 local:"Enregistré localement",types:["Manque d'eau","Faible pression","Fuite compteur","Fuite branchement","Robinet d'arrêt défectueux"]},
ar:{home:"الرئيسية",res:"الحجوزات",emp:"الموظفون",rep:"التقرير",claims:"الشكاوى",meters:"العدادات",neu:"شكوى جديدة",contract:"رقم العقد",type:"النوع",prio:"الأولوية",team:"الفريق",notes:"ملاحظات",recap:"ملخص — رقم العقد بعد التوحيد:",ok:"تأكيد وحفظ",back:"تعديل",
 nouvelle:"جديدة",affectee:"مُسندة",en_cours:"قيد التنفيذ",traitee:"معالجة",transferee:"محوّلة",urgente:"عاجلة",normale:"عادية",faible:"منخفضة",search:"العقد أو رقم العداد",savegps:"تسجيل موقع العداد",
 demo:"تحميل بيانات تجريبية",empty:"لا شيء بعد.",assign:"إسناد",recv:"تأكيد الاستلام",start:"بدء",done:"تمت المعالجة",transfer:"تحويل",cancel:"إلغاء (السبب مطلوب)",hist:"شكوى لهذا العقد",
 local:"محفوظ محليًا",types:["انقطاع الماء","ضعف الضغط","تسرب عند العداد","تسرب عند الربط","صمام الإيقاف معيب"]}};
let L='fr',V='home',D=null,db;const t=k=>TR[L][k]||k,$=s=>document.getElementById(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const open=(n='dm')=>new Promise(r=>{const q=indexedDB.open(n,3);q.onupgradeneeded=()=>{['claims','meters','events','res','rp'].forEach(s=>{if(!q.result.objectStoreNames.contains(s))q.result.createObjectStore(s,{keyPath:'id'})})};q.onsuccess=()=>r(q.result)});
const allRaw=s=>new Promise(r=>{const q=db.transaction(s).objectStore(s).getAll();q.onsuccess=()=>r(q.result)});
const visC=c=>{if(!S||!S.profile)return true;const r=S.profile.role;if(r=='admin'||r=='reception')return true;const me=S.user.id;return !c.createdBy||c.createdBy==me||c.assignedTo==me||(!!S.profile.team_id&&tid(c.team)==S.profile.team_id)};
const all=async s=>{const a=await allRaw(s);return s=='claims'?a.filter(visC):a};
const del=(s,id)=>new Promise(r=>{const q=db.transaction(s,'readwrite').objectStore(s).delete(id);q.onsuccess=()=>r()});
const put=(s,o,raw)=>new Promise(r=>{if(TB[s]&&!raw)o.sync='pending';const q=db.transaction(s,'readwrite').objectStore(s).put(o);q.onsuccess=()=>{r();if(TB[s]&&!raw)setTimeout(()=>sync(),400)}});
const uid=()=>crypto.randomUUID();
// normalisation : retire seulement espaces/séparateurs usuels, n'altère ni n'ajoute aucun caractère
const norm=s=>s.replace(/[\s.\-_\/,;]+/g,'.').replace(/^\.+|\.+$/g,'');const key=s=>String(s||'').replace(/[\s.\-_\/,;]+/g,'');
const ev=(rec,op,o,n,why)=>put('events',{id:uid(),at:new Date().toISOString(),op,rec,old:o,new:n,why});
function bd(c){return `<span class="b ${c.prio}">${t(c.prio)}</span> <span class="b" style="background:var(--line)">${t(c.status)}</span>${c.demo?' <span class="b demo">DÉMO</span>':''}${c.cancelled?' <span class="b x" style="color:#fff">ANNULÉE</span>':''}${syncB(c)}`}
async function draw(){document.dir=L=='ar'?'rtl':'ltr';
 $('nv').innerHTML=[['home','home'],['claims','claims'],['meters','meters'],['res','res'],['rep','rep'],...(S&&S.profile&&S.profile.role=='admin'?[['emp','emp']]:[])].map(([v,k])=>`<button onclick="V='${v}';D=null;draw()">${t(k)}</button>`).join('');
 const C=await all('claims'),M=await all('meters');const m=$('m');
 if(V=='home'){m.innerHTML=`<div class="g">${['nouvelle','affectee','en_cours','traitee','transferee'].map(s=>`<div class="c" onclick="V='claims';F='${s}';draw()"><div class="n">${C.filter(c=>c.status==s&&!c.cancelled).length}</div>${t(s)}</div>`).join('')}</div>
 <button class="s" onclick="V='new';draw()">+ ${t('neu')}</button><button onclick="sync(true)">Synchroniser maintenant</button><button onclick="pw()">Changer mon mot de passe</button>${isAdm()?`<button onclick="backup()">Sauvegarde (télécharger)</button><button class="x" onclick="wipeLocal()">Vider les données locales (cet appareil)</button>`:''}<p id="sy" style="font-size:14px"></p>
 <p style="font-size:14px">Une donnée est « Synchronisée » seulement après confirmation du serveur. Hors connexion : enregistrée localement, envoyée plus tard. Annulées exclues des chiffres.</p>`}
 if(V=='claims'){const l=C.filter(c=>!window.F||c.status==F).sort((a,b)=>b.created.localeCompare(a.created));window.F=null;
  m.innerHTML=`<button class="s" onclick="V='new';draw()">+ ${t('neu')}</button>`+(l.map(c=>`<div class="c" onclick="D='${c.id}';V='det';draw()"><b>${esc(c.contract)}</b> · ${esc(c.type)}<br>${bd(c)}<br><small>${new Date(c.created).toLocaleString()}${c.team?' · '+esc(c.team):''}</small></div>`).join('')||t('empty'))}
 if(V=='new')form();
 if(V=='det'){const c=C.find(x=>x.id==D),n=C.filter(x=>key(x.contract)==key(c.contract)).length-1;
  m.innerHTML=`<div class="c"><h2>${esc(c.contract)}</h2>${bd(c)}<p>${esc(c.type)}</p>${det(c)}<p>${n} ${t('hist')}</p>`+acts(c)+`</div><div id="rf"></div>`;refInto($('rf'),c.contract)}
 if(V=='meters')meterView(M);if(V=='res')resView();if(V=='rep')repView();if(V=='emp')empView()}
function acts(c){if(c.cancelled)return'';const s=c.status;let h='';const R=S.profile.role,own=R=='admin'||(R=='chef'&&!!S.profile.team_id&&tid(c.team)==S.profile.team_id),asg=R=='admin'||R=='reception';
 if(s=='nouvelle'&&asg)h+=`<select id="tm">${[1,2,3,4,5,6,7,8].map(i=>`<option>Équipe ${i}</option>`).join('')}</select><button onclick="up('${c.id}','affectee',{team:$('tm').value})">${t('assign')}</button>`;
 if(s=='affectee'&&!c.received&&own)h+=`<button onclick="up('${c.id}','affectee',{received:true,receivedAt:new Date().toISOString()})">${t('recv')}</button>`;
 if(s=='affectee'&&c.received&&own)h+=`<button onclick="up('${c.id}','en_cours')">${t('start')}</button>`;
 if((s=='en_cours'||s=='transferee')&&own)h+=`<button class="s" onclick="done('${c.id}')">${t('done')}</button>`;
 if((s=='en_cours'||s=='transferee')&&own)h+=`<button onclick="tr('${c.id}')">${t('transfer')}</button>`;
 if(!c.cancelled&&s!='traitee'){const isAg=c.assignedTo==S.user.id,ags=AGL(c);
 if(own&&(s=='affectee'||s=='en_cours')&&!c.submitted&&ags.length)h+=`<select id="ta">${ags.map(a=>`<option value="${a.id}" ${a.id==c.assignedTo?'selected':''}>${esc(((a.first_name||'')+' '+(a.last_name||'')).trim())}</option>`).join('')}</select><input id="tn" placeholder="Consigne pour l'agent (facultatif)" value="${esc(c.agentNote||'')}"><button onclick="toAgent('${c.id}')">${c.assignedTo?"Réassigner à l'agent":"Assigner à un agent"}</button>`;
 if(isAg&&s=='affectee'&&c.received)h+=`<button onclick="up('${c.id}','en_cours')">Démarrer l'intervention</button>`;
 if(isAg&&s=='en_cours'&&!c.submitted)h+=`<button class="s" onclick="submitC('${c.id}')">Envoyer au chef (intervention terminée)</button>`;
 if(own&&c.submitted)h+=`<button onclick="backAg('${c.id}')">Renvoyer à l'agent</button>`}
 if(!canEdit(c))return h;return h+`<button onclick="corr('${c.id}')">Corriger les informations</button><button class="x" onclick="canc('${c.id}')">${t('cancel')}</button>`}
async function up(id,st,x={}){const c=(await all('claims')).find(y=>y.id==id),o=c.status;Object.assign(c,x,{status:st});const ts=new Date().toISOString();if(st=='affectee'&&x.team)c.assignedAt=ts;if(st=='en_cours')c.startedAt=ts;if(st=='traitee')c.doneAt=ts;await put('claims',c);await ev(id,'statut',o,st);draw()}
async function tr(id){const d=prompt('Service / destinataire ?');const w=d&&prompt('Motif ?');if(!d||!w)return alert('Destinataire et motif obligatoires.');await up(id,'transferee',{dest:d,why:w,transferAt:new Date().toISOString()})}
async function canc(id){const w=prompt('Motif de l\'annulation ?');if(!w)return alert('Motif obligatoire.');const c=(await all('claims')).find(y=>y.id==id);c.cancelled=true;c.cancelWhy=w;c.cancelledBy=S.user.id;c.cancelledAt=new Date().toISOString();await put('claims',c);await ev(id,'annulation',null,w,w);draw()}
let P=null;
function form(step){const m=$('m');
 if(P){m.innerHTML=`<div class="c"><p>${t('recap')} <b>${esc(P.contract)}</b></p><p>${esc(P.type)} · ${t(P.prio)}<br>${esc(P.notes)}</p></div><button class="s" onclick="saveC()">${t('ok')}</button><button onclick="P=null;form()">${t('back')}</button>`;return}
 m.innerHTML=`<label>${t('contract')}*</label><input id="fc" inputmode="text" placeholder="ex. 13.10.01"><label>${t('type')}</label><select id="ft">${TR.fr.types.map((x,i)=>`<option value="${TR.fr.types[i]}">${t('types')[i]}</option>`).join('')}</select>
 <label>${t('prio')}</label><select id="fp">${['normale','urgente','faible'].map(x=>`<option value="${x}">${t(x)}</option>`).join('')}</select><label>${t('notes')}</label><textarea id="fn"></textarea><button class="s" onclick="rec()">OK</button>`}
function rec(){const c=norm($('fc').value);if(!c)return alert('Le numéro de contrat est obligatoire.');P={contract:c,type:$('ft').value,prio:$('fp').value,notes:$('fn').value};form()}
async function saveC(){const c={id:uid(),...P,status:'nouvelle',created:new Date().toISOString(),createdBy:S.user.id,sync:'local'};await put('claims',c);await ev(c.id,'création',null,c.contract);P=null;V='claims';draw()}
function meterView(M){const m=$('m');
 m.innerHTML=`<input id="q" placeholder="${t('search')}" oninput="sm()"><div id="r"></div><div id="rq"></div>`;window.MM=M;sm()}
function sm(){const q=key($('q').value||'').toLowerCase();$('r').innerHTML=window.MM.filter(x=>!q||key(x.contract).toLowerCase().includes(q)||(x.meterNo||'').toLowerCase().includes(q)).map(x=>
 `<div class="c"><b>${esc(x.contract)}</b> ${x.demo?'<span class="b demo">DÉMO</span>':''}<br>${x.lat!=null?`${x.lat.toFixed(5)}, ${x.lon.toFixed(5)} — ±${x.acc??'?'} m (${x.mode})<br><a href="https://www.google.com/maps/dir/?api=1&destination=${x.lat},${x.lon}">Itinéraire</a>`:'—'}<br><small>${syncL(x)}</small>
 <button onclick="gps('${x.id}')">${t('savegps')}</button></div>`).join('')+`<button class="s" onclick="addM()">+ Compteur</button>`;refInto($('rq'),$('q').value)}
async function addM(){const c=norm(prompt('N° de contrat ?')||'');if(!c)return;await put('meters',{id:uid(),contract:c,meterNo:prompt('N° compteur (facultatif)')||'',lat:null,lon:null,hist:[]});draw()}
function gps(id){if(!navigator.geolocation)return alert('GPS indisponible.');navigator.geolocation.getCurrentPosition(async p=>{const a=Math.round(p.coords.accuracy);
 if(!confirm(`Position mesurée : ${p.coords.latitude.toFixed(5)}, ${p.coords.longitude.toFixed(5)} (±${a} m). Enregistrer ?`))return;
 const x=(await all('meters')).find(y=>y.id==id);(x.hist=x.hist||[]).push({lat:x.lat,lon:x.lon,at:new Date().toISOString()});Object.assign(x,{lat:p.coords.latitude,lon:p.coords.longitude,acc:a,mode:'GPS mesuré',sync:'local'});await put('meters',x);await ev(id,'gps',null,[x.lat,x.lon]);draw()},e=>alert('GPS refusé ou indisponible : '+e.message),{enableHighAccuracy:true,timeout:20000})}
async function seed(){const T=['fuite','manque d\'eau','compteur'],S=['nouvelle','affectee','en_cours','traitee','transferee'];
 for(let i=0;i<5;i++)await put('claims',{id:uid(),contract:'DEMO-000'+(i+1),type:T[i%3],prio:['urgente','normale','faible'][i%3],status:S[i],team:i?'Équipe '+i:'',received:i>1,notes:'Donnée de démonstration',created:new Date(Date.now()-i*36e5).toISOString(),demo:true});
 await put('meters',{id:uid(),contract:'DEMO-0001',meterNo:'DEMO-M1',lat:null,lon:null,demo:true});draw()}
const TB={claims:'claims',meters:'meters',res:'reservations'};
const tid=n=>((window.TT||[]).find(x=>x.name==n)||{}).id||null,tnm=i=>((window.TT||[]).find(x=>x.id==i)||{}).name||'';
const ROW={claims:c=>({id:c.id,contract:c.contract,type:c.type,priority:c.prio,status:c.status,team_id:tid(c.team),notes:c.notes||null,received_at:c.receivedAt||(c.received?c.created:null),cancelled:!!c.cancelled,cancel_reason:c.cancelWhy||null,transfer_to:c.dest||null,transfer_reason:c.why||null,transferred_at:c.transferAt||null,demo:false,details:{assignedAt:c.assignedAt||null,startedAt:c.startedAt||null,doneAt:c.doneAt||null,method:c.method||null,materials:c.materials||null,result:c.result||null,cancelledAt:c.cancelledAt||null,cancelledBy:c.cancelledBy||null,history:c.history||[],sub:c.sub||null,submitted:!!c.submitted,agentNote:c.agentNote||null,returnNote:c.returnNote||null,returnedAt:c.returnedAt||null,agentAt:c.agentAt||null},assigned_to:c.assignedTo||null,created_by:c.createdBy||S.user.id,created_at:c.created}),
 meters:m=>({id:m.id,contract:m.contract,meter_no:m.meterNo||null,lat:m.lat,lon:m.lon,accuracy_m:m.acc??null,source:m.lat==null?null:(m.mode=='GPS mesuré'?'gps':'manuel'),author:S.user.id}),
 res:x=>({id:x.id,item:x.item,qty:x.qty,team_id:tid(x.team),day:x.day,reason:x.why||null,contract:x.contract||null,lead_name:x.lead||null,lead_matricule:x.leadMat||null,author:S.user.id})};
const LOC={claims:r=>({id:r.id,contract:r.contract,type:r.type,prio:r.priority,status:r.status,team:tnm(r.team_id),notes:r.notes,received:!!r.received_at,receivedAt:r.received_at,cancelled:r.cancelled,cancelWhy:r.cancel_reason,dest:r.transfer_to,why:r.transfer_reason,transferAt:r.transferred_at,...(r.details||{}),createdBy:r.created_by,assignedTo:r.assigned_to,created:r.created_at}),
 meters:r=>({id:r.id,contract:r.contract,meterNo:r.meter_no||'',lat:r.lat,lon:r.lon,acc:r.accuracy_m,mode:r.source=='gps'?'GPS mesuré':(r.source?'Choisi manuellement':undefined)}),
 res:r=>({id:r.id,item:r.item,qty:r.qty,team:tnm(r.team_id),day:r.day,why:r.reason,contract:r.contract,lead:r.lead_name,leadMat:r.lead_matricule})};
const syncL=x=>x.demo?'Démo (local)':x.sync=='synced'?'Synchronisé':x.sync=='failed'?'Échec de synchronisation':'En attente de synchronisation';
const syncB=x=>` <span class="b" style="background:var(--line)">${syncL(x)}</span>`;
let syncing=false;
let again=false;const SE=[];
async function sync(manual){if(!S||!db)return;if(syncing){again=true;return}syncing=true;SE.length=0;let ok=0,bad=0,msg='',chg=0;
 try{for(const s in TB){for(const x of await all(s)){if(x.sync=='synced'||x.demo)continue;
   try{const send=async u=>{const b=ROW[s](x);if(u){delete b.id;delete b.created_by;delete b.created_at;delete b.author}return api('/rest/v1/'+TB[s]+(u?'?id=eq.'+x.id:''),{method:u?'PATCH':'POST',headers:{Prefer:'return=representation'},body:JSON.stringify(b)})};
   let r=await send(!!x.remote);if(!r.ok&&r.status==409&&!x.remote)r=await send(true);const j=await r.json().catch(()=>null);
   if(r.ok&&Array.isArray(j)&&j.length){x.sync='synced';x.remote=true;ok++}else{x.sync='failed';bad++;msg=r.ok?'refusé par le serveur (droits insuffisants)':((j&&(j.message||j.hint||j.details))||r.status);SE.push(TB[s]+' · '+(x.contract||x.item||x.id)+' · '+(x.remote?'PATCH':'POST')+' HTTP '+r.status+' · '+msg)}
   await put(s,x,true)}catch(e){bad++;msg='erreur : '+e.message;SE.push(TB[s]+' · '+(x.contract||x.item||x.id)+' · '+msg)}}}
  for(const s in TB){const r=await api('/rest/v1/'+TB[s]+'?select=*&limit=1000');if(!r.ok)continue;const L0=await r.json();const ids=new Set(L0.map(x=>x.id));const loc=await allRaw(s);if(L0.length<1000)for(const x of loc)if(x.remote&&x.sync=='synced'&&!ids.has(x.id)){await del(s,x.id);chg++}const pend=new Set(loc.filter(x=>x.sync!='synced'&&!x.demo).map(x=>x.id));
   for(const row of L0){if(pend.has(row.id))continue;const old=loc.find(x=>x.id==row.id);const nw={...(old||{}),...LOC[s](row),sync:'synced',remote:true};if(!old||JSON.stringify(old)!=JSON.stringify(nw)){chg++;await put(s,nw,true)}}}
 try{const rr=await api('/rest/v1/reperes?select=id,ref,lat,lon,label&limit=1000');if(rr.ok){const L=await rr.json();if(L.length!=(await all('rp')).length)for(const q of L)await put('rp',q,true)}}catch(e){}
 }catch(e){msg=e.message}
 syncing=false;if(again){again=false;setTimeout(()=>sync(),300)}
 if(S&&['home','claims','meters','res','rep'].includes(V)&&(ok||chg||manual)&&!(V=='res'&&['ri','rq','rc','rr'].some(k=>$(k)&&$(k).value))&&!(document.activeElement&&document.activeElement.matches('input,textarea,select')))await draw();
